name: build-app

# ساخت خود اپ CI Builder (پوشهٔ android) روی گیت‌هاب؛ بدون نیاز به Android Studio.
# هر بار که فایل‌های پوشهٔ android تغییر کنند (یا دستی از تب Actions) اجرا می‌شود
# و APK آماده در بخش Releases (تگ app-latest) قرار می‌گیرد.

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-app.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: build debug apk
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CIBuilder.apk
          gh release delete app-latest --cleanup-tag --yes || true
          gh release create app-latest CIBuilder.apk \
            --target "$GITHUB_SHA" \
            --title "CI Builder (latest)" \
            --notes "APK اپ. این فایل را دانلود و نصب کنید."

      - uses: actions/upload-artifact@v4
        with:
          name: CIBuilder-apk
          path: CIBuilder.apk
          retention-days: 7
