name: build-app

# فقط یک فایل cibuilder.zip کنار این workflow در ریپو بگذارید.
# این workflow زیپ را باز می‌کند، اپ را می‌سازد و APK را در Releases (تگ app-latest) می‌گذارد.

on:
  workflow_dispatch:
  push:
    paths:
      - "cibuilder.zip"
      - ".github/workflows/build-app.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: unpack
        run: |
          test -f cibuilder.zip || { echo "فایل cibuilder.zip در ریپو نیست"; exit 1; }
          mkdir -p src
          unzip -q cibuilder.zip -d src
          ls -la src src/android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: accept sdk licenses
        run: |
          SM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          if [ -n "$SM" ]; then yes | "$SM" --licenses > /dev/null || true; fi
          echo done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: build debug apk
        working-directory: src/android
        run: gradle --no-daemon assembleDebug

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/android/app/build/outputs/apk/debug/app-debug.apk CIBuilder.apk
          gh release delete app-latest --cleanup-tag --yes || true
          gh release create app-latest CIBuilder.apk \
            --target "$GITHUB_SHA" \
            --title "CI Builder (latest)" \
            --notes "APK اپ. این فایل را دانلود و نصب کنید."

      - uses: actions/upload-artifact@v4
        with:
          name: CIBuilder-apk
          path: CIBuilder.apk
          retention-days: 7
